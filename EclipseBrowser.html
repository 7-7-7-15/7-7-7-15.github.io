<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Eclipse Browser</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r134/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vanta@0.5.21/dist/vanta.tris.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Roboto', sans-serif;
      background: #000000;
      color: #ffffff;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: background 0.5s;
    }

    .tabs-container {
      background: #111111;
      display: flex;
      flex-direction: row;
      align-items: center;
      padding: 5px 10px;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
      overflow-x: auto;
      justify-content: flex-start;
      gap: 5px;
      order: 1;
      z-index: 100;
    }

    .tab {
      background: linear-gradient(135deg, #222222, #333333);
      color: #ffffff;
      padding: 8px 15px 8px 12px;
      margin-right: 2px;
      border-radius: 8px 8px 0 0;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.3s ease;
      min-width: 120px;
      max-width: 200px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
      position: relative;
      border: 1px solid #444444;
      border-bottom: none;
      box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.3);
    }

    .tab.active {
      background: linear-gradient(135deg, #333333, #444444);
      transform: translateY(-2px);
      box-shadow: 0 -4px 8px rgba(255, 255, 255, 0.1);
      border-color: #666666;
      z-index: 10;
    }

    .tab.active::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 3px;
      background: #ffffff;
      border-radius: 0 0 3px 3px;
    }

    .tab:hover {
      background: linear-gradient(135deg, #3a3a3a, #4a4a4a);
      transform: translateY(-1px);
    }

    .tab-icon {
      margin-right: 6px;
      font-size: 12px;
      color: #aaaaaa;
    }

    .tab.active .tab-icon {
      color: #ffffff;
    }

    .tab-close {
      margin-left: auto;
      color: #aaaaaa;
      cursor: pointer;
      font-size: 14px;
      padding: 2px;
      border-radius: 50%;
      width: 16px;
      height: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .tab-close:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .new-tab-btn {
      background: #222222;
      color: #ffffff;
      padding: 6px 10px;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      margin-left: auto;
      font-size: 16px;
      line-height: 1;
      transition: background 0.3s, transform 0.2s;
    }

    .new-tab-btn:hover {
      background: #444444;
      transform: scale(1.1);
    }

    .browser-toolbar {
      background: #111111;
      padding: 10px 15px;
      display: flex;
      align-items: center;
      box-shadow: 0 2px 10px rgba(255, 255, 255, 0.1);
      border-bottom: 1px solid #333333;
      gap: 10px;
      order: 2;
    }

    .browser-toolbar button {
      padding: 8px 12px;
      border: none;
      background: #222222;
      color: #ffffff;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
      transition: background 0.3s, transform 0.2s, box-shadow 0.3s;
    }

    .browser-toolbar button:hover {
      background: #444444;
      transform: translateY(-2px);
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.1);
    }

    .browser-toolbar button:active {
      transform: translateY(0);
      box-shadow: 0 2px 8px rgba(255, 255, 255, 0.05);
    }

    .browser-toolbar button#fullscreen-btn {
      padding: 6px;
      font-size: 14px;
      width: 30px;
      height: 30px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .url-container {
      flex: 1;
      display: flex;
      align-items: center;
      position: relative;
    }

    .browser-toolbar input {
      flex: 1;
      padding: 10px 15px;
      font-size: 16px;
      border: none;
      border-radius: 50px;
      background: #222222;
      color: #ffffff;
      box-shadow: inset 0 1px 3px rgba(0, 0, 0, 0.5);
      transition: box-shadow 0.3s, transform 0.2s;
    }

    .browser-toolbar input:focus {
      outline: none;
      box-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
      transform: scale(1.01);
    }

    .proxy-dropdown {
      position: relative;
      display: inline-block;
    }

    .proxy-btn {
      padding: 10px 15px;
      background: linear-gradient(135deg, #222222, #333333);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.3s ease, transform 0.2s;
      position: relative;
      overflow: hidden;
    }

    .proxy-btn:hover {
      background: linear-gradient(135deg, #3a3a3a, #4a4a4a);
      transform: translateY(-2px);
    }

    .proxy-btn.active {
      background: linear-gradient(135deg, #1a4d7f, #2a6da3);
      box-shadow: 0 0 10px rgba(42, 109, 163, 0.5);
      transform: translateY(-1px);
    }

    .proxy-btn::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transition: 0.5s;
    }

    .proxy-btn.active::before {
      left: 100%;
    }

    .proxy-btn i {
      font-size: 14px;
      transition: transform 0.3s;
    }

    .proxy-btn.active i {
      transform: rotate(360deg);
    }

    .proxy-dropdown-content {
      display: none;
      position: absolute;
      right: 0;
      background: #222222;
      min-width: 220px;
      box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
      border-radius: 10px;
      z-index: 100;
      overflow: hidden;
      margin-top: 5px;
      transform-origin: top right;
      transform: scaleY(0);
      transition: transform 0.3s ease, opacity 0.3s ease;
      opacity: 0;
    }

    .proxy-dropdown-content.show {
      display: block;
      transform: scaleY(1);
      opacity: 1;
    }

    .proxy-option {
      color: #ffffff;
      padding: 12px 16px;
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      transition: all 0.3s ease;
      border-bottom: 1px solid #333333;
      position: relative;
      overflow: hidden;
    }

    .proxy-option:last-child {
      border-bottom: none;
    }

    .proxy-option:hover {
      background: linear-gradient(90deg, #444444, #555555);
      transform: translateX(5px);
    }

    .proxy-option.active {
      background: linear-gradient(90deg, #1a4d7f, #2a6da3);
      transform: translateX(5px);
    }

    .proxy-option.active::after {
      content: '✓';
      position: absolute;
      right: 15px;
      color: #ffffff;
      font-weight: bold;
    }

    /* Replace the fullscreen button styles */
#fullscreen-btn::before {
  content: '⋮';
  font-weight: bold;
  font-size: 18px;
}

.fullscreen #fullscreen-btn::before {
  content: '⋮';
}

/* Add settings dropdown styles */
.settings-dropdown {
  position: relative;
  display: inline-block;
}

.settings-dropdown-content {
  display: none;
  position: absolute;
  right: 0;
  background: #222222;
  min-width: 200px;
  box-shadow: 0 8px 16px rgba(0, 0, 0, 0.5);
  border-radius: 10px;
  z-index: 100;
  overflow: hidden;
  margin-top: 5px;
  transform-origin: top right;
  transform: scaleY(0);
  transition: transform 0.3s ease, opacity 0.3s ease;
  opacity: 0;
}

.settings-dropdown-content.show {
  display: block;
  transform: scaleY(1);
  opacity: 1;
}

.settings-option {
  color: #ffffff;
  padding: 12px 16px;
  text-decoration: none;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: all 0.3s ease;
  border-bottom: 1px solid #333333;
  position: relative;
  overflow: hidden;
}

.settings-option:last-child {
  border-bottom: none;
}

.settings-option:hover {
  background: linear-gradient(90deg, #444444, #555555);
  transform: translateX(5px);
}
    .content-container {
      flex: 1;
      position: relative;
      order: 3;
    }

    .content-frame {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: none;
      background: #000000;
      display: none;
    }

    .content-frame.active {
      display: block;
    }

    .loading-indicator {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: #ffffff;
      font-size: 18px;
      display: none;
    }

    .eclipse-effect {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      background: radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.15) 0%, transparent 50%);
      z-index: -1;
      animation: eclipse-pulse 12s infinite alternate;
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg"><circle cx="2" cy="2" r="1" fill="white" opacity="0.3"/></svg>') repeat;
      opacity: 0.4;
      z-index: -1;
      animation: twinkle 3s infinite;
    }

    @keyframes eclipse-pulse {
      0% { opacity: 0.7; transform: scale(1); }
      100% { opacity: 1; transform: scale(1.1); }
    }

    @keyframes twinkle {
      0% { opacity: 0.4; }
      50% { opacity: 0.6; }
      100% { opacity: 0.4; }
    }

    .browser-toolbar button.refresh::before {
      content: '↻';
    }

    .browser-toolbar button.home i {
      font-size: 14px;
    }

    .custom-cursor {
      cursor: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 24 24"><path d="M0 0l12 24 12-24H0z" fill="white"/></svg>') 0 24, auto;
    }
  </style>
</head>
<body>
  <div class="eclipse-effect"></div>
  <div class="stars"></div>
  <div class="tabs-container">
    <button class="new-tab-btn" onclick="addNewTab()">+</button>
  </div>
  <div class="browser-toolbar">
    <button onclick="goBack()">←</button>
    <button onclick="goForward()">→</button>
    <button class="refresh" onclick="refresh()"></button>
    <button class="home" onclick="goHome()"><i class="fas fa-home"></i></button>
    <div class="url-container">
      <input type="text" id="url-input" placeholder="Enter URL or search query" onkeypress="if(event.key === 'Enter') loadContent()">
    </div>
    <button onclick="loadContent()">Go</button>
    <div class="proxy-dropdown">
      <button class="proxy-btn" onclick="toggleProxyDropdown()">
        <i class="fas fa-server"></i> Proxy Off
      </button>
      <div class="proxy-dropdown-content" id="proxy-dropdown">
        <div class="proxy-option active" onclick="selectProxy('Proxy Off', null)">
          <i class="fas fa-power-off"></i> Proxy Off
        </div>
        <div class="proxy-option" onclick="selectProxy('Server A', 'https://embeddr.rhw.one/embed#')">
          <i class="fas fa-server"></i> Server A
        </div>
        <div class="proxy-option" onclick="selectProxy('Server B', 'https://finance.v2202211188549209536.happysrv.de/explore/embed.html?p=')">
          <i class="fas fa-server"></i> Server B
        </div>
        <div class="proxy-option" onclick="selectProxy('Server C', 'https://supergisfire.com/scramjet/')">
          <i class="fas fa-server"></i> Server C
        </div>
        <div class="proxy-option" onclick="selectProxy('Server D', 'https://www.v2202211188549209536.happysrv.de/explore/embed.html?p=')">
          <i class="fas fa-server"></i> Server D
        </div>
      </div>
    </div>
    <button id="fullscreen-btn" onclick="toggleFullscreen()"></button>
  </div>
  <div class="content-container">
    <div class="loading-indicator" id="loading-indicator">Loading...</div>
  </div>


  <script>
    let tabs = [];
    let activeTabIndex = -1;
    let currentTheme = 'eclipse';
    let currentProxy = 'Proxy Off';
    let currentProxyUrl = null;
    let vantaEffect = null;
    let cloakSettings = { title: 'Eclipse Browser', favicon: null };
    let adBlockEnabled = false;
    let customCursorEnabled = false;

    const tabsContainer = document.querySelector('.tabs-container');
    const contentContainer = document.querySelector('.content-container');
    const urlInput = document.getElementById('url-input');
    const loadingIndicator = document.getElementById('loading-indicator');
    const homePageUrl = 'https://7-7-7-15.github.io/browser/EclipseBrowserHomepage.html';

    function createTab(title = 'New Tab') {
      console.log(`Creating tab ${tabs.length} with title: ${title}`);
      const tabId = tabs.length;
      const tabElement = document.createElement('div');
      tabElement.classList.add('tab');

      let icon = 'fa-file';
      if (title === 'Home') icon = 'fa-home';
      else if (title === 'Settings') icon = 'fa-cog';
      else if (title.includes('Search')) icon = 'fa-search';
      else if (title === 'Error') icon = 'fa-exclamation-triangle';

      tabElement.innerHTML = `
        <i class="fas ${icon} tab-icon"></i>
        ${title}
        <span class="tab-close" onclick="closeTab(${tabId})">×</span>
      `;

      tabElement.onclick = (e) => {
        if (e.target !== tabElement.querySelector('.tab-close')) switchTab(tabId);
      };

      tabsContainer.insertBefore(tabElement, tabsContainer.querySelector('.new-tab-btn'));

      const frame = document.createElement('iframe');
      frame.classList.add('content-frame');
      frame.sandbox = 'allow-scripts allow-same-origin allow-popups allow-forms';
      frame.onload = () => {
        console.log(`Iframe ${tabId} loaded: ${frame.src || 'srcdoc'}`);
        loadingIndicator.style.display = 'none';
        updateSettingsValues();
      };

      frame.onerror = (e) => {
        console.error(`Iframe ${tabId} error:`, e);
        frame.srcdoc = `<h1 style="color: white; text-align: center; font-family: Roboto, sans-serif;">Failed to load content</h1>`;
        loadingIndicator.style.display = 'none';
      };

      contentContainer.appendChild(frame);

      tabs.push({ tabElement, frame, title, history: [], currentHistoryIndex: -1 });
      console.log(`Tab ${tabId} created with iframe`);
      updateTabList();
      return tabId;
    }

    function switchTab(index) {
      console.log(`Switching to tab ${index}`);
      if (activeTabIndex !== -1) {
        tabs[activeTabIndex].tabElement.classList.remove('active');
        tabs[activeTabIndex].frame.classList.remove('active');
      }
      activeTabIndex = index;
      tabs[index].tabElement.classList.add('active');
      tabs[index].frame.classList.add('active');
      const currentUrl = tabs[index].history[tabs[index].currentHistoryIndex] || '';
      urlInput.value = currentUrl;
      applyCloakSettings();
      applyZoomLevel();
      loadingIndicator.style.display = 'none';
      updateSettingsValues();
    }

    function addNewTab() {
      console.log('Adding new tab');
      const newTabId = createTab('Home');
      switchTab(newTabId);
      loadContent('Eclipse://Home');
    }

    function closeTab(index) {
      console.log(`Closing tab ${index}`);
      if (tabs.length === 1) return;
      tabs[index].tabElement.remove();
      tabs[index].frame.remove();
      tabs.splice(index, 1);
      if (activeTabIndex === index) {
        switchTab(Math.max(0, index - 1));
      } else if (activeTabIndex > index) {
        activeTabIndex--;
      }
      updateTabList();
    }

    function updateTabTitle(index, title) {
      console.log(`Updating title for tab ${index}: ${title}`);
      tabs[index].title = title;

      let icon = 'fa-file';
      if (title === 'Home') icon = 'fa-home';
      else if (title === 'Settings') icon = 'fa-cog';
      else if (title.includes('Search')) icon = 'fa-search';
      else if (title === 'Error') icon = 'fa-exclamation-triangle';

      tabs[index].tabElement.innerHTML = `
        <i class="fas ${icon} tab-icon"></i>
        ${title}
        <span class="tab-close" onclick="closeTab(${index})">×</span>
      `;

      const tabElement = tabs[index].tabElement;
      const closeBtn = tabElement.querySelector('.tab-close');
      closeBtn.onclick = () => closeTab(index);
      tabElement.onclick = (e) => {
        if (e.target !== closeBtn) switchTab(index);
      };

      if (index === activeTabIndex) {
        applyCloakSettings();
      }
    }

    function isSearchQuery(input) {
      return !input.includes('.') &&
             !input.toLowerCase().startsWith('http://') &&
             !input.toLowerCase().startsWith('https://') &&
             !input.includes('<') &&
             !input.includes('>') &&
             !input.toLowerCase().startsWith('eclipse://');
    }

    function loadContent(url = urlInput.value.trim()) {
      if (activeTabIndex === -1) {
        console.error('No active tab');
        return;
      }

      console.log(`Loading content for tab ${activeTabIndex}: ${url}`);
      const frame = tabs[activeTabIndex].frame;
      let title = 'New Tab';
      let displayUrl = url;
      url = url.trim();
      loadingIndicator.style.display = 'block';

      if (!url) {
        console.warn('Empty URL input');
        frame.srcdoc = `<h1 style="color: white; text-align: center; font-family: Roboto, sans-serif;">Please enter a valid URL or search query.</h1>`;
        title = 'Error';
        urlInput.value = '';
        updateTabTitle(activeTabIndex, title);
        loadingIndicator.style.display = 'none';
        return;
      }

      frame.src = 'about:blank';

      setTimeout(() => {
        try {
          if (url.toLowerCase() === 'eclipse://home') {
            console.log(`Loading homepage: ${homePageUrl}`);
            frame.src = homePageUrl;
            title = 'Home';
            displayUrl = 'Eclipse://Home';
          } else if (url.toLowerCase() === 'eclipse://settings') {
            console.log('Loading settings page');
            frame.srcdoc = settingsPageContent;
            title = 'Settings';
            displayUrl = 'Eclipse://Settings';
            updateTabList();
            updateHistoryList();
            updateSessionList();
            updateSettingsValues();
          } else if (url.toLowerCase().startsWith('eclipse://')) {
            frame.srcdoc = `<h1 style="color: white; text-align: center; font-family: Roboto, sans-serif;">Unknown Eclipse URL: ${url}</h1>`;
            title = 'Unknown URL';
            displayUrl = url;
          } else if (url.includes('<') && url.includes('>')) {
            console.log('Loading custom HTML');
            frame.srcdoc = url;
            title = 'Custom HTML';
            displayUrl = 'Custom HTML';
          } else {
            let finalUrl = url;

            if (isSearchQuery(url) && currentProxyUrl) {
              console.log('Performing search query with proxy:', url);
              finalUrl = currentProxyUrl + 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
              title = `Search: ${url}`;
              displayUrl = url;
            } else if (isSearchQuery(url) && !currentProxyUrl) {
              console.log('Performing search query directly:', url);
              finalUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
              title = `Search: ${url}`;
              displayUrl = url;
            } else if (currentProxyUrl && !isSearchQuery(url)) {
              if (!url.toLowerCase().startsWith('http://') && !url.toLowerCase().startsWith('https://')) {
                url = 'https://' + url;
              }
              console.log('Proxying URL:', url);
              finalUrl = currentProxyUrl + url;
              title = new URL(url).hostname;
              displayUrl = url;
            } else {
              if (!url.toLowerCase().startsWith('http://') && !url.toLowerCase().startsWith('https://')) {
                finalUrl = 'https://' + url;
                console.log(`Prepended HTTPS: ${finalUrl}`);
              }

              try {
                new URL(finalUrl);
                console.log(`Loading external URL: ${finalUrl}`);
                title = new URL(finalUrl).hostname;
                displayUrl = finalUrl;
              } catch {
                console.log('Invalid URL, treating as search query:', url);
                if (currentProxyUrl) {
                  finalUrl = currentProxyUrl + 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
                } else {
                  finalUrl = 'https://duckduckgo.com/?q=' + encodeURIComponent(url);
                }
                title = `Search: ${url}`;
                displayUrl = url;
              }
            }

            if (adBlockEnabled) {
              console.log('Ad blocker enabled for:', finalUrl);
            }

            frame.src = finalUrl;
          }

          urlInput.value = displayUrl;
          updateTabTitle(activeTabIndex, title);

          const history = tabs[activeTabIndex].history;
          if (history[tabs[activeTabIndex].currentHistoryIndex] !== displayUrl) {
            history.splice(tabs[activeTabIndex].currentHistoryIndex + 1);
            history.push(displayUrl);
            tabs[activeTabIndex].currentHistoryIndex = history.length - 1;
            console.log(`History updated for tab ${activeTabIndex}: ${displayUrl}`);
            updateHistoryList();
          }

          setTimeout(() => {
            loadingIndicator.style.display = 'none';
          }, 1000);

        } catch (e) {
          console.error(`Error loading content: ${e.message}`);
          frame.srcdoc = `<h1 style="color: white; text-align: center; font-family: Roboto, sans-serif;">Failed to load content: ${e.message}</h1>`;
          title = 'Error';
          urlInput.value = url;
          updateTabTitle(activeTabIndex, title);
          loadingIndicator.style.display = 'none';
        }
      }, 100);
    }

    function goBack() {
      if (activeTabIndex === -1) return;
      const tab = tabs[activeTabIndex];
      if (tab.currentHistoryIndex > 0) {
        tab.currentHistoryIndex--;
        urlInput.value = tab.history[tab.currentHistoryIndex];
        console.log(`Going back to: ${tab.history[tab.currentHistoryIndex]}`);
        loadContent(tab.history[tab.currentHistoryIndex]);
      }
    }

    function goForward() {
      if (activeTabIndex === -1) return;
      const tab = tabs[activeTabIndex];
      if (tab.currentHistoryIndex < tab.history.length - 1) {
        tab.currentHistoryIndex++;
        urlInput.value = tab.history[tab.currentHistoryIndex];
        console.log(`Going forward to: ${tab.history[tab.currentHistoryIndex]}`);
        loadContent(tab.history[tab.currentHistoryIndex]);
      }
    }

    function refresh() {
      if (activeTabIndex === -1) return;
      const currentUrl = tabs[activeTabIndex].history[tabs[activeTabIndex].currentHistoryIndex];
      if (currentUrl) {
        console.log(`Refreshing: ${currentUrl}`);
        loadContent(currentUrl);
      }
    }

    function goHome() {
      console.log('Navigating to home');
      loadContent('Eclipse://Home');
    }

    function toggleFullscreen() {
      console.log('Toggling fullscreen');
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen();
        document.body.classList.add('fullscreen');
      } else {
        document.exitFullscreen();
        document.body.classList.remove('fullscreen');
      }
    }

    function toggleProxyDropdown() {
      const dropdown = document.getElementById('proxy-dropdown');
      dropdown.classList.toggle('show');
    }

    function selectProxy(name, url) {
      currentProxy = name;
      currentProxyUrl = url;

      const proxyBtn = document.querySelector('.proxy-btn');
      proxyBtn.innerHTML = `<i class="fas fa-server"></i> ${name}`;
      proxyBtn.classList.add('active');
      setTimeout(() => proxyBtn.classList.remove('active'), 500);

      const options = document.querySelectorAll('.proxy-option');
      options.forEach(option => {
        option.classList.remove('active');
        if (option.textContent.trim() === name) {
          option.classList.add('active');
        }
      });

      document.getElementById('proxy-dropdown').classList.remove('show');

      console.log(`Proxy switched to: ${name}`);

      if (activeTabIndex !== -1) {
        const currentUrl = tabs[activeTabIndex].history[tabs[activeTabIndex].currentHistoryIndex];
        if (currentUrl && !currentUrl.startsWith('Eclipse://') && currentUrl !== 'Custom HTML') {
          console.log('Reloading current page with new proxy settings');
          loadContent(currentUrl);
        }
      }
      updateSettingsValues();
    }

    function changeTheme(theme) {
      console.log(`Changing theme to: ${theme}`);
      currentTheme = theme;
      if (theme === 'eclipse') {
        document.body.style.background = '#000000';
        document.querySelector('.eclipse-effect').style.background = 'radial-gradient(circle at 50% 30%, rgba(255, 255, 255, 0.15) 0%, transparent 50%)';
        document.querySelectorAll('.settings-container, .tabs-container, .browser-toolbar').forEach(el => {
          el.style.background = '#111111';
          el.style.color = '#ffffff';
        });
        document.querySelectorAll('.tab, .browser-toolbar button, .browser-toolbar input, .settings-container select, .settings-container input, .settings-container button').forEach(el => {
          el.style.background = '';
          el.style.color = '#ffffff';
          if (el.tagName === 'INPUT' || el.tagName === 'SELECT') {
            el.style.background = '#222222';
          }
          if (el.classList.contains('tab')) {
            el.style.background = 'linear-gradient(135deg, #222222, #333333)';
          }
        });
      } else if (theme === 'nebula') {
        document.body.style.background = 'linear-gradient(135deg, #1a0033, #330066)';
        document.querySelector('.eclipse-effect').style.background = 'radial-gradient(circle at 50% 30%, rgba(200, 0, 255, 0.2) 0%, transparent 50%)';
        document.querySelectorAll('.settings-container, .tabs-container, .browser-toolbar').forEach(el => {
          el.style.background = 'linear-gradient(135deg, #2a0044, #440088)';
          el.style.color = '#ffffff';
        });
        document.querySelectorAll('.tab, .browser-toolbar button, .browser-toolbar input, .settings-container select, .settings-container input, .settings-container button').forEach(el => {
          el.style.background = '';
          el.style.color = '#ffffff';
          if (el.tagName === 'INPUT' || el.tagName === 'SELECT') {
            el.style.background = '#222222';
          }
          if (el.classList.contains('tab')) {
            el.style.background = 'linear-gradient(135deg, #222222, #333333)';
          }
        });
      } else if (theme === 'light') {
        document.body.style.background = '#ffffff';
        document.querySelector('.eclipse-effect').style.background = 'radial-gradient(circle at 50% 30%, rgba(0, 0, 0, 0.1) 0%, transparent 50%)';
        document.querySelectorAll('.settings-container, .tabs-container, .browser-toolbar').forEach(el => {
          el.style.background = '#f0f0f0';
          el.style.color = '#000000';
        });
        document.querySelectorAll('.tab, .browser-toolbar button, .browser-toolbar input, .settings-container select, .settings-container input, .settings-container button').forEach(el => {
          el.style.background = '#e0e0e0';
          el.style.color = '#000000';
        });
      }
      updateSettingsValues();
    }

    function toggleAnimation(value) {
      console.log(`Toggling animation: ${value}`);
      const eclipseEffect = document.querySelector('.eclipse-effect');
      const stars = document.querySelector('.stars');
      if (value === 'off') {
        eclipseEffect.style.animation = 'none';
        stars.style.animation = 'none';
      } else {
        eclipseEffect.style.animation = 'eclipse-pulse 12s infinite alternate';
        stars.style.animation = 'twinkle 3s infinite';
      }
      updateSettingsValues();
    }

    function setPresetBackground(value) {
      console.log(`Setting preset background: ${value}`);
      if (value === 'default') {
        document.body.style.background = '#000000';
        document.querySelector('.stars').style.display = 'block';
      } else if (value === 'nebula') {
        document.body.style.background = 'url("https://images.unsplash.com/photo-1447433693259-c8549e352d5d?fit=crop&w=1920&q=80") no-repeat center/cover';
        document.querySelector('.stars').style.display = 'none';
      } else if (value === 'cosmic') {
        document.body.style.background = 'url("https://images.unsplash.com/photo-1538370965046-9667c50b88c0?fit=crop&w=1920&q=80") no-repeat center/cover';
        document.querySelector('.stars').style.display = 'none';
      }
      if (vantaEffect) {
        vantaEffect.destroy();
        vantaEffect = null;
      }
      updateSettingsValues();
    }

    function setCustomBackground(url) {
      console.log(`Setting custom background: ${url}`);
      if (url) {
        try {
          new URL(url);
          document.body.style.background = `url("${url}") no-repeat center/cover`;
          document.querySelector('.stars').style.display = 'none';
          if (vantaEffect) {
            vantaEffect.destroy();
            vantaEffect = null;
          }
        } catch {
          console.warn('Invalid background URL');
        }
      }
      updateSettingsValues();
    }

    function toggleVantaBackground(value) {
      console.log(`Toggling Vanta background: ${value}`);
      if (value === 'on') {
        if (!vantaEffect) {
          vantaEffect = VANTA.TRIS({
            el: document.body,
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: currentTheme === 'nebula' ? 0x550088 : 0x222222,
            backgroundColor: currentTheme === 'light' ? 0xffffff : 0x000000
          });
          document.querySelector('.stars').style.display = 'none';
          document.querySelector('.eclipse-effect').style.display = 'none';
        }
      } else {
        if (vantaEffect) {
          vantaEffect.destroy();
          vantaEffect = null;
        }
        document.querySelector('.stars').style.display = 'block';
        document.querySelector('.eclipse-effect').style.display = 'block';
        setPresetBackground(document.querySelector('#preset-bg-select')?.value || 'default');
      }
      updateSettingsValues();
    }

    function setCloakTitle(title) {
      console.log(`Setting cloak title: ${title}`);
      cloakSettings.title = title || 'Eclipse Browser';
      applyCloakSettings();
      updateSettingsValues();
    }

    function setCloakFavicon(url) {
      console.log(`Setting cloak favicon: ${url}`);
      cloakSettings.favicon = url;
      applyCloakSettings();
      updateSettingsValues();
    }

    function applyCloakSettings() {
      document.title = tabs[activeTabIndex]?.title ? `${tabs[activeTabIndex].title} - ${cloakSettings.title}` : cloakSettings.title;
      const favicon = document.querySelector('link[rel="icon"]');
      if (favicon) favicon.remove();
      if (cloakSettings.favicon) {
        const newFavicon = document.createElement('link');
        newFavicon.rel = 'icon';
        newFavicon.href = cloakSettings.favicon;
        document.head.appendChild(newFavicon);
      }
    }

    function setAutoCloseTimer(seconds) {
      console.log(`Setting auto-close timer: ${seconds} seconds`);
      clearTimeout(window.autoCloseTimer);
      if (seconds > 0) {
        window.autoCloseTimer = setTimeout(() => {
          if (tabs.length > 1) closeTab(activeTabIndex);
        }, seconds * 1000);
      }
      updateSettingsValues();
    }

    function updateTabList() {
      if (activeTabIndex !== -1 && tabs[activeTabIndex].title === 'Settings') {
        const tabList = tabs[activeTabIndex].frame.contentDocument.getElementById('tab-list');
        if (tabList) {
          tabList.innerHTML = tabs.map((tab, index) => `
            <li>${tab.title} <button onclick="parent.closeTab(${index})">Close</button></li>
          `).join('');
        }
      }
    }

    function closeAllTabs() {
      console.log('Closing all tabs except one');
      while (tabs.length > 1) {
        closeTab(tabs.length - 1);
      }
    }

    function setDefaultProxy(name) {
      console.log(`Setting default proxy: ${name}`);
      const proxyUrls = {
        'Proxy Off': null,
        'Server A': 'https://embeddr.rhw.one/embed#',
        'Server B': 'https://finance.v2202211188549209536.happysrv.de/explore/embed.html?p=',
        'Server C': 'https://supergisfire.com/scramjet/',
        'Server D': 'https://www.v2202211188549209536.happysrv.de/explore/embed.html?p='
      };
      selectProxy(name, proxyUrls[name]);
      updateSettingsValues();
    }

    function setZoomLevel(level) {
      console.log(`Setting zoom level: ${level}`);
      if (activeTabIndex !== -1) {
        tabs[activeTabIndex].frame.style.transform = `scale(${level})`;
        tabs[activeTabIndex].frame.style.transformOrigin = 'top left';
        tabs[activeTabIndex].frame.style.width = `${100 / level}%`;
        tabs[activeTabIndex].frame.style.height = `${100 / level}%`;
      }
      updateSettingsValues();
    }

    function applyZoomLevel() {
      const select = tabs[activeTabIndex]?.frame.contentDocument?.getElementById('zoom-select');
      if (select) {
        setZoomLevel(select.value);
      }
    }

    function toggleAdBlocker(value) {
      console.log(`Toggling ad blocker: ${value}`);
      adBlockEnabled = value === 'on';
      if (activeTabIndex !== -1) {
        const currentUrl = tabs[activeTabIndex].history[tabs[activeTabIndex].currentHistoryIndex];
        if (currentUrl && !currentUrl.startsWith('Eclipse://')) {
          loadContent(currentUrl);
        }
      }
      updateSettingsValues();
    }

    function updateHistoryList() {
      if (activeTabIndex !== -1 && tabs[activeTabIndex].title === 'Settings') {
        const historyList = tabs[activeTabIndex].frame.contentDocument.getElementById('history-list');
        if (historyList) {
          historyList.innerHTML = tabs.flatMap((tab, index) =>
            tab.history.map(url => `
              <li>${url} (Tab ${index + 1}) <button onclick="parent.loadContent('${url}')">Visit</button></li>
            `)
          ).join('');
        }
      }
    }

    function clearHistory() {
      console.log('Clearing history');
      tabs.forEach(tab => {
        tab.history = [];
        tab.currentHistoryIndex = -1;
      });
      updateHistoryList();
    }

    function saveSession() {
      console.log('Saving session');
      const session = tabs.map(tab => ({
        title: tab.title,
        history: tab.history,
        currentHistoryIndex: tab.currentHistoryIndex
      }));
      const sessionName = `Session_${new Date().toISOString()}`;
      localStorage.setItem(sessionName, JSON.stringify(session));
      updateSessionList();
    }

    function loadSession(sessionName) {
      console.log(`Loading session: ${sessionName}`);
      if (sessionName) {
        const session = JSON.parse(localStorage.getItem(sessionName));
        if (session) {
          while (tabs.length > 0) closeTab(0);
          session.forEach(tabData => {
            const tabId = createTab(tabData.title);
            tabs[tabId].history = tabData.history;
            tabs[tabId].currentHistoryIndex = tabData.currentHistoryIndex;
            if (tabData.currentHistoryIndex >= 0) {
              loadContent(tabData.history[tabData.currentHistoryIndex]);
            }
          });
          switchTab(0);
        }
      }
    }

    function updateSessionList() {
      if (activeTabIndex !== -1 && tabs[activeTabIndex].title === 'Settings') {
        const sessionSelect = tabs[activeTabIndex].frame.contentDocument.getElementById('saved-sessions');
        if (sessionSelect) {
          sessionSelect.innerHTML = '<option value="">Select a session</option>' +
            Object.keys(localStorage)
              .filter(key => key.startsWith('Session_'))
              .map(key => `<option value="${key}">${key}</option>`)
              .join('');
        }
      }
    }

    function toggleCustomCursor(value) {
      console.log(`Toggling custom cursor: ${value}`);
      customCursorEnabled = value === 'on';
      document.body.classList.toggle('custom-cursor', customCursorEnabled);
      updateSettingsValues();
    }

    function toggleShortcuts(value) {
      console.log(`Toggling keyboard shortcuts: ${value}`);
      updateSettingsValues();
    }

    function showDownloads() {
      console.log('Showing downloads');
      if (activeTabIndex !== -1) {
        tabs[activeTabIndex].frame.srcdoc = `<h1 style="color: white; text-align: center; font-family: Roboto, sans-serif;">Download Manager</h1>`;
        updateTabTitle(activeTabIndex, 'Downloads');
      }
    }

    function updateSettingsValues() {
      if (activeTabIndex !== -1 && tabs[activeTabIndex].title === 'Settings') {
        const doc = tabs[activeTabIndex].frame.contentDocument;
        if (doc) {
          const themeSelect = doc.getElementById('theme-select');
          const animationSelect = doc.getElementById('animation-select');
          const presetBgSelect = doc.getElementById('preset-bg-select');
          const vantaBgSelect = doc.getElementById('vanta-bg-select');
          const cursorSelect = doc.getElementById('cursor-select');
          const proxySelect = doc.getElementById('proxy-select');
          const zoomSelect = doc.getElementById('zoom-select');
          const adblockSelect = doc.getElementById('adblock-select');
          const cloakTitle = doc.getElementById('cloak-title');
          const cloakFavicon = doc.getElementById('cloak-favicon');

          if (themeSelect) themeSelect.value = currentTheme;
          if (animationSelect) animationSelect.value = document.querySelector('.eclipse-effect').style.animation ? 'on' : 'off';
          if (presetBgSelect) presetBgSelect.value = document.body.style.background.includes('url') ? (document.body.style.background.includes('1447433693259') ? 'nebula' : 'cosmic') : 'default';
          if (vantaBgSelect) vantaBgSelect.value = vantaEffect ? 'on' : 'off';
          if (cursorSelect) cursorSelect.value = customCursorEnabled ? 'on' : 'off';
          if (proxySelect) proxySelect.value = currentProxy;
          if (zoomSelect) zoomSelect.value = tabs[activeTabIndex]?.frame.style.transform ? tabs[activeTabIndex].frame.style.transform.replace('scale(', '').replace(')', '') : '1';
          if (adblockSelect) adblockSelect.value = adBlockEnabled ? 'on' : 'off';
          if (cloakTitle) cloakTitle.value = cloakSettings.title;
          if (cloakFavicon) cloakFavicon.value = cloakSettings.favicon || '';
        }
      }
    }

    window.onclick = function(event) {
      if (!event.target.matches('.proxy-btn') && !event.target.closest('.proxy-option')) {
        const dropdowns = document.getElementsByClassName('proxy-dropdown-content');
        for (let i = 0; i < dropdowns.length; i++) {
          const openDropdown = dropdowns[i];
          if (openDropdown.classList.contains('show')) {
            openDropdown.classList.remove('show');
          }
        }
      }
    };

    document.addEventListener('fullscreenchange', () => {
      if (!document.fullscreenElement) {
        document.body.classList.remove('fullscreen');
      }
    });

    document.addEventListener('keydown', (e) => {
      if (e.ctrlKey && e.key === 't') {
        e.preventDefault();
        addNewTab();
      } else if (e.ctrlKey && e.key === 'w') {
        e.preventDefault();
        if (activeTabIndex !== -1) closeTab(activeTabIndex);
      } else if (e.altKey && e.key === 'ArrowLeft') {
        e.preventDefault();
        goBack();
      } else if (e.altKey && e.key === 'ArrowRight') {
        e.preventDefault();
        goForward();
      } else if (e.ctrlKey && e.key === 'r') {
        e.preventDefault();
        refresh();
      }
    });

    console.log('Initializing browser with new tab');
    addNewTab();
  </script>
</body>
</html>
