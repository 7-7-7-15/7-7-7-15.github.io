 <style>

            text-align: center;

        body::before {

        #us5-form {

            height: 54px; /* Fixed height for the form */
        }
        
        .search-bar-home {
            flex: 1;
            padding: 16px 20px;
            font-size: 1.1rem;
            border: none;
            border-radius: 10px 0 0 10px;
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(5px);
            color: white;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
            outline: none;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-right: none;
            height: 100%; /* Take full height of parent */

        .search-bar-home::placeholder {
            color: rgba(255, 255, 255, 0.7);

        .search-bar-home:focus {
            background: rgba(255, 255, 255, 0.18);

            border: 1px solid rgba(100, 180, 255, 0.5);
            border-right: none;
        }
        
        #search-button {
            padding: 0 25px; /* Remove vertical padding since height is fixed */
            font-size: 1.1rem;
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white;
            border: none;
            border-radius: 0 10px 10px 0;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Poppins', sans-serif;
            font-weight: 500;
            letter-spacing: 1px;
            border: 1px solid rgba(100, 150, 255, 0.3);
            border-left: none;
            height: 100%; /* Take full height of parent */
            min-width: 60px; /* Ensure button has minimum width */
        }
        
        #search-button:hover {
            background: linear-gradient(135deg, #5fb6ff 0%, #1af7ff 100%);

        .desc {
            margin-top: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        
        #us5-error, #us5-error-code {

        }
        
        #parts {
            position: absolute;

        }
        
        .footer {
            margin-top: 30px;
            font-size: 0.85rem;
            color: #94a3b8;
        }
        
        @media (max-width: 768px) {
            h1 {
                font-size: 2.8rem;
            }
            
            .tagline {
                font-size: 1rem;
            }
            
            .container {
                padding: 25px 15px;
                width: 95%;
            }
            
            #us5-form {
                height: 50px; /* Slightly smaller on mobile */
            }
            
            .search-bar-home {
                padding: 14px 18px;
                font-size: 1rem;
            }
            
            #search-button {
                padding: 0 20px;
                font-size: 1rem;
                min-width: 55px;
            }

  <body>
    <script src="/storage/js/parts.js"></script>
    <script src="/storage/js/ap.js"></script>
    <div id="parts"></div>
    <h1>Eclipse</h1>
    <p id="dynamicParagraph">(TEXT)</p>
    <div id="search-container">
      <form id="us5-form">
        <input id="us5-search-engine" value="https://duckduckgo.com/?q=%s" type="hidden" />
        <input id="us5-address" type="text" class="search-bar-home" placeholder="Search or enter a URL" />
        <button id="search-button" onclick="search()">SEARCH <i class="fa-solid fa-magnifying-glass"></i>
        </button>
      </form>
      <div class="desc left-margin">
        <p id="us5-error"></p>
        <pre id="us5-error-code"></pre>
      </div>
    </div>
    <script src="https://finance.v2202211188549209536.happysrv.de/explore/us5/us5.bundle.js" defer></script>
    <script src="https://finance.v2202211188549209536.happysrv.de/explore/us5/us5.config.js" defer></script>
    <script src="https://finance.v2202211188549209536.happysrv.de/explore/register-sw.js" defer></script>
    <script type="text/javascript" src="/storage/js/background.js"></script>
    <script src="/storage/js/splash-messages.js"></script>
    <script>
      document.getElementById('us5-form').addEventListener('submit', function(event) {
        event.preventDefault();
        search();
      });

      function search() {
        const inputRaw = document.getElementById('us5-address').value.trim();
        if (!inputRaw) return;
        const hasProtocol = /^https?:\/\//i.test(inputRaw);
        const looksLikeURL = /\.[a-z]{2,}(\/|$)/i.test(inputRaw);
        let finalURL;
        if (hasProtocol) {
          finalURL = inputRaw;
        } else if (looksLikeURL) {
          finalURL = 'http://' + inputRaw;
        } else {
          const searchEngine = document.getElementById('us5-search-engine').value;
          finalURL = searchEngine.replace('%s', encodeURIComponent(inputRaw));
        }
        window.location.href = `https://finance.v2202211188549209536.happysrv.de/explore/embed.html?p=${finalURL}`;
      }
    </script>
    <script>
      async function regsw() {
        await navigator.serviceWorker.register("https://finance.v2202211188549209536.happysrv.de/explore/us5-sw.js", {
          scope: "/explore/",
        });
      }
      regsw();
    </script>
    <script>
      const code = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a', 'Enter'];
      let currentKeyIndex = 0;
      document.addEventListener('keydown', (event) => {
        if (event.key === code[currentKeyIndex]) {
          currentKeyIndex++;
          if (currentKeyIndex === code.length) {
            window.location.href = "/pages/super-secret.html"
            currentKeyIndex = 0;
          }
        } else {
          currentKeyIndex = 0;
        }
      });
    </script>
