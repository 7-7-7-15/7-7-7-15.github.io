    <script>
        document.getElementById('us5-form').addEventListener('submit', function(event) {
            event.preventDefault();
            search();
        });

        function search() {
            const inputRaw = document.getElementById('us5-address').value.trim();
            if (!inputRaw) return;
            const hasProtocol = /^https?:\/\//i.test(inputRaw);
            const looksLikeURL = /\.[a-z]{2,}(\/|$)/i.test(inputRaw);
            let finalURL;
            if (hasProtocol) {
                finalURL = inputRaw;
            } else if (looksLikeURL) {
                finalURL = 'http://' + inputRaw;
            } else {
                const searchEngine = document.getElementById('us5-search-engine').value;
                finalURL = searchEngine.replace('%s', encodeURIComponent(inputRaw));
            }
            window.location.href = `https://finance.v2202211188549209536.happysrv.de/explore/embed.html?p=${finalURL}`;
        }
    </script>
    
    <script>
        async function regsw() {
            await navigator.serviceWorker.register("/explore/us5-sw.js", {
                scope: "/explore/",
            });
        }
        regsw();
    </script>
    
    <script>
        const code = ['ArrowUp', 'ArrowUp', 'ArrowDown', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'ArrowLeft', 'ArrowRight', 'b', 'a', 'Enter'];
        let currentKeyIndex = 0;
        document.addEventListener('keydown', (event) => {
            if (event.key === code[currentKeyIndex]) {
                currentKeyIndex++;
                if (currentKeyIndex === code.length) {
                    window.location.href = "/pages/super-secret.html"
                    currentKeyIndex = 0;
                }
            } else {
                currentKeyIndex = 0;
            }
        });
    </script>
