            const remaining = docHref.replace(`${localhost}/EclipseGames`, "").replace("/index.html", "").replace(".html", "");
            return `Eclipse-games://${remaining}`;
          }
          if (docHref.includes(`${localhost}/pages/apps-frame.html?url=/pages/apps/`)) {
            const remaining = docHref.replace(`${localhost}/pages/apps-frame.html?url=/pages/apps/`, "").replace("/index.html", "").replace(".html", "");
            return `Eclipse-apps://${remaining}`;
          }
          //heartive
          if (docHref.includes(`${localhost}`)) {
            const remaining = docHref.replace(`${localhost}`, "").replace("/index.html", "").replace(".html", "");
            return `Eclipse-media://${remaining}`;
          }
          switch (docHref) {
              //origin
            case `${localhost}/explore/index.html`:
              return "Eclipse://new-tab-page";
            case `${localhost}/pages/settings.html`:
              return "Eclipse://settings";
            case `${localhost}/EclipseGames`:
              return "Eclipse://games";
            case `${localhost}/pages/apps.html`:
              return "Eclipse://apps";
            case `${localhost}/pages/partners.html`:
              return "Eclipse://partners";
            case `${localhost}/pages/credits.html`:
              return "Eclipse://credits";
            case `${localhost}/pages/extra.html`:
              return "Eclipse://extra";
            case `${localhost}/pages/data.html`:
              return "Eclipse://data";
            case `${localhost}/pages/extra/data-use.html`:
              return "Eclipse://data-usage";
            case `${localhost}/pages/super-secret.html`:
              return "Eclipse://secret";
            case `${localhost}/pages/music.html`:
              return "Eclipse://music";
            case `${localhost}/pages/links.html`:
              return "Eclipse://link-portal";
            case `${localhost}/pages/us5.html`:
              return "Eclipse://link-portal/us5";
            case `${localhost}/pages/us4.html`:
              return "Eclipse://link-portal/us4";
            case `${localhost}/storage/images/cheese.png`:
              return "Eclipse://cheese.png";
            case `${localhost}/pages/announcement-maker.html`:
              return "Eclipse://announcement-maker";
            default:
              if (docHref.startsWith(hostPrefix)) {
                return decodeURI(docHref.replace(hostPrefix, ""));
              }
              return decodeURI(docHref);
          }
        } catch (e) {
          console.error('Error unproxifying URL:', e);
          return docHref;
        }
      }
      //updsb
      function updateSearchBar(iframe) {
        try {
          let rawUrl = iframe.src;
          try {
            rawUrl = iframe.contentWindow.location.href;
          } catch {}
          const unproxifiedUrl = getUnproxifiedUrl(rawUrl);
          document.getElementById('search-input').value = unproxifiedUrl;
          const activeTab = document.querySelector('.tab.active');
          updateTabName(iframe, activeTab);
        } catch (e) {
          console.error('Error updating search bar:', e);
        }
      }
      //tabft
      function updateTabName(iframe) {
        setTimeout(() => {
          const tabIndex = Array.from(document.querySelectorAll('.tab-iframe')).indexOf(iframe);
          const tab = document.querySelectorAll('.tab')[tabIndex];
          if (tab) {
            const exploreLoadPrefix = "https://" + window.location.hostname + "/explore/web/";
            const docHref = iframe.contentWindow.location.href;
            if (docHref.startsWith(exploreLoadPrefix)) {
              const path = docHref.replace(exploreLoadPrefix, "");
              let host;
              try {
                host = new URL(__us5$config.decodeUrl(path));
              } catch {
                host = new URL("https://voucan-us4.github.io");
              }
              const faviconUrl = `https://t1.gstatic.com/faviconV2?client=SOCIAL&type=FAVICON&fallback_opts=TYPE,SIZE,URL&url=https://${host.hostname}&size=24`;
              let title = '';
              try {
                title = iframe.contentWindow.document.title || host.hostname;
              } catch {
                title = host.hostname || 'Tabname not Loaded';
              }
              if (title.length > 29) {
                title = title.substring(0, 26) + '...';
              }
              tab.innerHTML = `
																									
																									
																										
																									
																									
																									
																									
																									<img src="${faviconUrl}" alt="favicon" style="width:24px;height:24px;margin-right:6px;">${title}
																										
																										
																											
																										
																										
																										
																										
																										<span class="close-button" onclick="closeTab(event)">×</span> `;
            }
          }
        }, 500);
      }
      //searchbar engage check
      function engaged() {
        const input = document.getElementById('search-input');
        return document.activeElement === input || input.matches(':hover');
      }
      setInterval(() => {
        const iframe = document.querySelector('.tab-iframe.active');
        if (!iframe || engaged()) return;
        try {
          const docHref = iframe.contentWindow.location.href;
          if (docHref) {
            updateSearchBar(iframe);
          }
        } catch (e) {
          console.warn('Unable to access iframe location:', e);
        }
      }, 500);
      //param
      document.addEventListener("DOMContentLoaded", () => {
        const link = new URLSearchParams(window.location.search).get('link');
        if (link) {
          const startingtab = document.querySelector('.tab-iframe');
          if (startingtab) {
            startingtab.src = `/explore/web/${__us5$config.encodeUrl(link)}`;
            startingtab.onload = () => {
              updateSearchBar(startingtab);
              updateTabName(startingtab);
            };
          }
        }
      });

      function setIframe(url, name, icon) {
        const tabs = Array.from(document.querySelectorAll('.tab'));
        const iframes = Array.from(document.querySelectorAll('.tab-iframe'));
        const activeTab = document.querySelector('.tab.active');
        const tabIndex = tabs.indexOf(activeTab);
        if (activeTab && tabIndex !== -1) {
          tabs[tabIndex].remove();
          iframes[tabIndex].remove();
        }
        tabCount++;
        const tabsContainer = document.getElementById('tabs');
        const newTab = document.createElement('div');
        newTab.classList.add('tab');
        newTab.innerHTML = `
																										
																										
																											
																										
																										
																										
																										
																										<img src=${icon} alt="favicon" style="width:24px;height:24px;margin-right:6px;"> ${name} 
																											
																											
																												
																											
																											
																											
																											
																											<span class="close-button" onclick="closeTab(event)">×</span>`;
        newTab.addEventListener("click", () => selectTab(newTab));
        const referenceTab = document.querySelectorAll('.tab')[tabIndex];
        if (referenceTab) {
          tabsContainer.insertBefore(newTab, referenceTab);
        } else {
          tabsContainer.insertBefore(newTab, document.querySelector('.add-tab-button'));
        }
        const iframe = document.createElement('iframe');
        iframe.classList.add('tab-iframe');
        iframe.src = url;
        iframe.onload = function() {
          updateSearchBar(iframe);
          updateTabName(iframe);
        };
        const contentWrapper = document.getElementById('content-wrapper');
        const allIframes = document.querySelectorAll('.tab-iframe');
        const referenceIframe = allIframes[tabIndex];
        if (referenceIframe) {
          contentWrapper.insertBefore(iframe, referenceIframe);
        } else {
          contentWrapper.appendChild(iframe);
        }
        selectTab(newTab);
      }
      document.addEventListener("DOMContentLoaded", () => {
        const launch = new URLSearchParams(window.location.search).get('launch');
        if (launch) {
          const startingtab = document.querySelector('.tab-iframe');
          if (startingtab) {
            startingtab.src = `/explore/web/${__us5$config.encodeUrl(launch)}`;
            startingtab.onload = () => {
              updateSearchBar(startingtab);
              updateTabName(startingtab);
            };
          }
        }
      });

      function openInAboutBlank() {
        const siteTitle = localStorage.getItem('siteTitle') || "Home";
        const siteLogo = localStorage.getItem('siteLogo') || "https://raw.githubusercontent.com/voucan/voucan.github.io/refs/heads/main/googleclassroom.png";
        const newTab = window.open('about:blank', '_blank');
        if (newTab) {
          newTab.document.title = siteTitle;
          const favicon = newTab.document.createElement('link');
          favicon.rel = 'icon';
          favicon.href = siteLogo;
          newTab.document.head.appendChild(favicon);
          const iframe = newTab.document.createElement('iframe');
          const frame = document.querySelector('.tab-iframe.active');
          const open = frame.contentWindow.location.href;
          iframe.src = open;
          iframe.style.width = '100vw';
          iframe.style.height = '100vh';
          iframe.style.border = 'none';
          newTab.document.body.style.margin = '0';
          newTab.document.body.appendChild(iframe);
        } else {
          console.error("Failed to open About:Blank page.");
        }
      }
    </script>
    <script>
      document.getElementById("tabs").addEventListener("dblclick", () => {
        const docElm = document.documentElement;
        if (!document.fullscreenElement) {
          if (docElm.requestFullscreen) {
            docElm.requestFullscreen();
          } else if (docElm.mozRequestFullScreen) {
            docElm.mozRequestFullScreen();
          } else if (docElm.webkitRequestFullscreen) {
            docElm.webkitRequestFullscreen();
          } else if (docElm.msRequestFullscreen) {
            docElm.msRequestFullscreen();
          }
        } else {
          if (document.exitFullscreen) {
            document.exitFullscreen();
          } else if (document.mozCancelFullScreen) {
            document.mozCancelFullScreen();
          } else if (document.webkitExitFullscreen) {
            document.webkitExitFullscreen();
          } else if (document.msExitFullscreen) {
            document.msExitFullscreen();
          }
        }
      });
    </script>
    <script>
      window.addEventListener("DOMContentLoaded", () => {
        const prvtime = localStorage.getItem("welcomecd");
        const today = new Date().toLocaleDateString();
        if (prvtime === today) {
          return;
        }
        localStorage.setItem("welcomecd", today);
        const username = localStorage.getItem("username");
        if (username) {
          showWelcome(username);
          return;
        }
        showUsernamePrompt();
      });

      function showUsernamePrompt() {
        const userBgColor = localStorage.getItem('backgroundColor') || '#070c24';
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = 0;
        overlay.style.left = 0;
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.background = 'rgba(0, 0, 0, 0.5)';
        overlay.style.backdropFilter = 'blur(5px)';
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.zIndex = '3000';
        const modal = document.createElement('div');
        modal.style.background = userBgColor;
        modal.style.color = 'white';
        modal.style.padding = '30px 40px';
        modal.style.borderRadius = '20px';
        modal.style.boxShadow = '0 0 20px rgba(255, 255, 255, 0.2)';
        modal.style.fontFamily = "'Comfortaa', sans-serif";
        modal.style.fontSize = '16px';
        modal.style.textAlign = 'center';
        modal.style.maxWidth = '400px';
        modal.style.width = '90%';
        modal.style.position = 'relative';
        const header = document.createElement('h2');
        header.textContent = 'Enter a Username';
        header.style.marginBottom = '15px';
        header.style.fontSize = '22px';
        header.style.letterSpacing = '1px';
        header.style.color = 'white';
        header.style.textShadow = '0 0 0.8px black';
        modal.appendChild(header);
        const input = document.createElement('input');
        input.type = 'text';
        input.placeholder = 'Your username';
        input.style.padding = '10px';
        input.style.marginBottom = '20px';
        input.style.width = '80%';
        input.style.borderRadius = '10px';
        input.style.border = 'none';
        input.style.outline = 'none';
        input.style.fontSize = '16px';
        input.style.textAlign = 'center';
        input.style.fontFamily = "'Comfortaa', sans-serif";
        modal.appendChild(input);
        const buttonsContainer = document.createElement('div');
        buttonsContainer.style.display = 'flex';
        buttonsContainer.style.flexDirection = 'row';
        buttonsContainer.style.justifyContent = 'center';
        buttonsContainer.style.gap = '15px';
        buttonsContainer.style.alignItems = 'center';
        buttonsContainer.style.marginTop = '10px';
        const submitButton = document.createElement('button');
        submitButton.textContent = 'Continue';
        styleButton(submitButton);
        const skipButton = document.createElement('button');
        skipButton.textContent = 'Skip';
        styleButton(skipButton);
        submitButton.addEventListener('click', () => {
          const name = input.value.trim();
          if (name) {
            localStorage.setItem("username", name);
            document.body.removeChild(overlay);
            showWelcome(name);
          }
        });
        skipButton.addEventListener('click', () => {
          localStorage.setItem("username", "Anonymous");
          document.body.removeChild(overlay);
          showWelcome("Anonymous");
        });
        buttonsContainer.appendChild(submitButton);
        buttonsContainer.appendChild(skipButton);
        modal.appendChild(buttonsContainer);
        overlay.appendChild(modal);
        document.body.appendChild(overlay);
      }

      function styleButton(btn) {
        btn.style.padding = '10px 20px';
        btn.style.border = 'none';
        btn.style.borderRadius = '70px';
        btn.style.background = 'rgba(255, 255, 255, 0.2)';
        btn.style.color = 'white';
        btn.style.cursor = 'pointer';
        btn.style.fontFamily = "'Comfortaa', sans-serif";
        btn.style.transition = 'background-color 0.3s';
        btn.addEventListener('mouseenter', () => {
          btn.style.background = 'rgba(255, 255, 255, 0.4)';
        });
        btn.addEventListener('mouseleave', () => {
          btn.style.background = 'rgba(255, 255, 255, 0.2)';
        });
      }

      function showWelcome(username) {
        const userBgColor = localStorage.getItem('backgroundColor') || '#070c24';
        const overlay = document.createElement('div');
        overlay.style.position = 'fixed';
        overlay.style.top = 0;
        overlay.style.left = 0;
        overlay.style.width = '100%';
        overlay.style.height = '100%';
        overlay.style.background = 'rgba(0, 0, 0, 0.5)';
        overlay.style.backdropFilter = 'blur(5px)';
        overlay.style.display = 'flex';
        overlay.style.alignItems = 'center';
        overlay.style.justifyContent = 'center';
        overlay.style.zIndex = '3000';
        const modal = document.createElement('div');
        modal.style.background = userBgColor;
        modal.style.color = 'white';
        modal.style.padding = '30px 40px';
        modal.style.borderRadius = '20px';
        modal.style.boxShadow = '0 0 20px rgba(255, 255, 255, 0.2)';
        modal.style.fontFamily = "'Comfortaa', sans-serif";
        modal.style.fontSize = '16px';
        modal.style.textAlign = 'center';
        modal.style.maxWidth = '400px';
        modal.style.width = '90%';
        modal.style.position = 'relative';
        modal.style.display = 'flex';
        modal.style.flexDirection = 'column';
        modal.style.alignItems = 'center';
        const img = document.createElement('img');
        img.src = '/storage/images/512x512.png';
        img.style.width = '100px';
        img.style.marginBottom = '15px';
        img.style.opacity = '0';
        img.style.transform = 'scale(0.8)';
        img.style.transition = 'all 1s ease';
        modal.appendChild(img);
        const header = document.createElement('h2');
        header.textContent = username === "Anonymous" ? "Welcome to Eclipse!" : `Welcome to Eclipse, ${username}!`;
        header.style.marginTop = '0';
        header.style.fontSize = '22px';
        header.style.letterSpacing = '1px';
        header.style.color = 'white';
        header.style.textShadow = '0 0 0.8px black';
        header.style.opacity = '0';
        header.style.transition = 'opacity 1s ease';
        modal.appendChild(header);
        overlay.appendChild(modal);
        document.body.appendChild(overlay);
        setTimeout(() => {
          img.style.opacity = '1';
          img.style.transform = 'scale(1)';
          header.style.opacity = '1';
        }, 100);
        setTimeout(() => {
          overlay.style.transition = 'opacity 1s ease';
          overlay.style.opacity = '0';
          setTimeout(() => overlay.remove(), 1000);
        }, 3000);
      }
    </script>

            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              url: window.location.origin
            })
          });
          if (!res.ok) {
            console.error("Failed to send URL:", res.statusText);
          }
        } catch (err) {

        }
