name: Add One Spelunky Folder Hourly

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour, on the hour
  workflow_dispatch:

jobs:
  add-spelunky-folder:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Find highest Spelunky folder number
        id: findmax
        run: |
          max=0
          if [ -d Spelunky ]; then
            for d in Spelunky/*/ ; do
              n=$(basename "$d")
              if [[ $n =~ ^[0-9]+$ ]] && [ "$n" -gt "$max" ]; then
                max=$n
              fi
            done
          fi
          echo "max=$max" >> $GITHUB_OUTPUT

      - name: Add next folder and copy index.html
        run: |
          next=$(( ${{ steps.findmax.outputs.max }} + 1 ))
          mkdir -p Spelunky/$next
          cp Spelunky/index.html Spelunky/$next/index.html

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Spelunky/
          git commit -m "Automated: Add Spelunky/$(( ${{ steps.findmax.outputs.max }} + 1 ))" || echo "No changes to commit"
          git push
