name: Clone and Increment Publish Hourly plus On Push

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Get and increment counter
        id: counter
        run: |
          if [ -f .counter ]; then
            num=$(cat .counter)
            num=$((num + 1))
          else
            num=1
          fi
          echo $num > .counter
          echo "num=$num" >> $GITHUB_ENV

      - name: Build site structure
        run: |
          mkdir -p _site
          mkdir -p "_site/Spelunky"
          mkdir -p "_site/Spelunky/${num}"
          cp Spelunky/index.html "_site/Spelunky/${num}/index.html"
          # Also copy the counter file
          cp .counter _site/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site/
          name: github-pages

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
