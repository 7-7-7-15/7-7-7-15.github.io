name: Deploy Spelunky to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Create site structure
        run: |
          # Create public directory for Pages
          mkdir -p public
          
          # Copy your Spelunky game files to the root
          cp -r Spelunky/* public/ || echo "No Spelunky directory found"
          
          # If you want versioned deployments, uncomment below:
          # mkdir -p "public/versions"
          # cp -r Spelunky/* "public/versions/v1/" || echo "No Spelunky directory found"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public/

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
