<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TV Browser – Pure Iframe</title>
<style>
  :root{--bg:#141414;--card:#221f1f;--txt:#fff;--acc:#e50914}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:Helvetica,Arial,sans-serif}
  header{padding:1rem 2rem;background:rgba(0,0,0,.7);position:sticky;top:0;z-index:10}
  #search{width:100%;max-width:500px;padding:.6rem 1rem;font-size:1rem;border-radius:4px;border:none;background:#333;color:#fff}
  main{padding:2rem}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
  .card{height:300px;background:#000 center/cover no-repeat;border-radius:8px;cursor:pointer;position:relative;overflow:hidden;transition:transform .2s}
  .card:hover{transform:scale(1.05)}
  .card::after{content:attr(data-title);position:absolute;bottom:0;left:0;right:0;
    background:linear-gradient(transparent,rgba(0,0,0,.8));padding:1rem .5rem .5rem;
    font-size:.9rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  #player-box{margin-top:2rem;text-align:center;display:none}
  iframe{border:none}
  .no-results{color:#aaa;font-style:italic;margin:1rem 0}
</style>
</head>
<body>

<header>
  <input type="text" id="search" placeholder="Search titles…" autofocus>
</header>

<main>
  <div id="grid"></div>
  <p id="no-results" class="no-results" style="display:none">No titles found.</p>

  <section id="player-box">
    <h2 id="title"></h2>
    <iframe id="player" width="800" height="600"
            sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-top-navigation">
    </iframe>
  </section>
</main>

<script>
  // --------------------------------------------------------------
  // 1. Load JSON
  // --------------------------------------------------------------
  let db = [];
  const MAX = 10;

  fetch('https://7-7-7-15.github.io/Tv.json')
    .then(r => r.json())
    .then(data => { db = data; render([]); })
    .catch(e => console.error(e));

  // --------------------------------------------------------------
  // 2. Search
  // --------------------------------------------------------------
  const search = document.getElementById('search');
  let timer;
  search.addEventListener('input', () => {
    clearTimeout(timer);
    timer = setTimeout(() => {
      const term = search.value.trim().toLowerCase();
      const list = term ? db.filter(i => i.title.toLowerCase().includes(term)) : db;
      render(list.slice(0, MAX));
    }, 200);
  });

  // --------------------------------------------------------------
  // 3. Render cards
  // --------------------------------------------------------------
  const grid = document.getElementById('grid');
  const no = document.getElementById('no-results');

  function render(list) {
    grid.innerHTML = '';
    if (!list.length) { no.style.display='block'; return; }
    no.style.display='none';

    list.forEach(item => {
      const c = document.createElement('div');
      c.className='card';
      c.dataset.title = item.title;
      c.dataset.tmdb  = item.tmdb;
      c.style.backgroundImage = `ur[](https://image.tmdb.org/t/p/w300_and_h450_bestv2/${item.tmdb}.jpg)`;
      c.addEventListener('click', () => play(item));
      grid.appendChild(c);
    });
  }

  // --------------------------------------------------------------
  // 4. PLAYER – JUST AN IFRAME
  // --------------------------------------------------------------
  const box    = document.getElementById('player-box');
  const iframe = document.getElementById('player');
  const title  = document.getElementById('title');

  function play(item) {
    const url = `https://turbovid.eu/api/req/tv/${item.tmdb}/1/1`;
    iframe.src = url;                     // ← pure iframe
    title.textContent = item.title;
    box.style.display = 'block';
    box.scrollIntoView({behavior:'smooth'});
  }
</script>
</body>
</html>
