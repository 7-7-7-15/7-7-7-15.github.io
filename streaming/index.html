<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>TurboFlix – Ultra Netflix Clone</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link href="https://fonts.googleapis.com/css2?family=Netflix+Sans:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.gstatic.com">
<style>
/* ============================================= */
/* 1. ROOT & DESIGN TOKENS                       */
/* ============================================= */
:root {
  /* Core Colors */
  --netflix-red: #e50914;
  --netflix-red-dark: #b20710;
  --netflix-red-hover: #f40612;
  --netflix-red-light: #ff0a16;
  
  /* Background Colors */
  --bg-primary: #141414;
  --bg-secondary: #181818;
  --bg-tertiary: #1f1f1f;
  --bg-card: #2f2f2f;
  --bg-overlay: rgba(0, 0, 0, 0.75);
  --bg-modal: rgba(20, 20, 20, 0.98);
  --bg-gradient-top: linear-gradient(180deg, rgba(20,20,20,1) 0%, rgba(20,20,20,0.8) 50%, rgba(20,20,20,0) 100%);
  --bg-gradient-bottom: linear-gradient(0deg, rgba(20,20,20,1) 0%, rgba(20,20,20,0.8) 50%, rgba(20,20,20,0) 100%);
  
  /* Text Colors */
  --text-primary: #ffffff;
  --text-secondary: #d2d2d2;
  --text-tertiary: #b3b3b3;
  --text-muted: #808080;
  --text-faint: #6b6b6b;
  --text-disabled: #4a4a4a;
  
  /* Border & Separator */
  --border-primary: rgba(255, 255, 255, 0.15);
  --border-secondary: rgba(255, 255, 255, 0.1);
  --border-faint: rgba(255, 255, 255, 0.05);
  --separator: rgba(255, 255, 255, 0.25);
  
  /* Shadows */
  --shadow-xs: 0 1px 2px rgba(0, 0, 0, 0.2);
  --shadow-sm: 0 2px 6px rgba(0, 0, 0, 0.3);
  --shadow-md: 0 4px 12px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 8px 24px rgba(0, 0, 0, 0.6);
  --shadow-xl: 0 12px 40px rgba(0, 0, 0, 0.7);
  --shadow-2xl: 0 20px 60px rgba(0, 0, 0, 0.85);
  --shadow-red: 0 0 20px rgba(229, 9, 20, 0.4);
  --shadow-red-strong: 0 0 30px rgba(229, 9, 20, 0.6);
  
  /* Border Radius */
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 6px;
  --radius-lg: 8px;
  --radius-xl: 12px;
  --radius-2xl: 16px;
  --radius-full: 9999px;
  
  /* Transitions */
  --transition-instant: 0.1s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-base: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  --transition-slow: 0.45s cubic-bezier(0.25, 0.8, 0.25, 1);
  --transition-slower: 0.6s cubic-bezier(0.25, 0.8, 0.25, 1);
  
  /* Animation Curves */
  --ease-in-out: cubic-bezier(0.4, 0, 0.2, 1);
  --ease-out: cubic-bezier(0, 0, 0.2, 1);
  --ease-in: cubic-bezier(0.4, 0, 1, 1);
  --ease-bounce: cubic-bezier(0.68, -0.55, 0.265, 1.55);
  
  /* Spacing Scale */
  --space-1: 0.25rem;
  --space-2: 0.5rem;
  --space-3: 0.75rem;
  --space-4: 1rem;
  --space-5: 1.25rem;
  --space-6: 1.5rem;
  --space-8: 2rem;
  --space-10: 2.5rem;
  --space-12: 3rem;
  --space-16: 4rem;
  --space-20: 5rem;
  --space-24: 6rem;
  
  /* Font Weights */
  --font-thin: 100;
  --font-light: 300;
  --font-regular: 400;
  --font-medium: 500;
  --font-semibold: 600;
  --font-bold: 700;
  --font-extrabold: 800;
  --font-black: 900;
  
  /* Z-Index Scale */
  --z-base: 1;
  --z-dropdown: 10;
  --z-sticky: 100;
  --z-fixed: 1000;
  --z-overlay: 2000;
  --z-modal: 3000;
  --z-popover: 4000;
  --z-toast: 5000;
  --z-splash: 9999;
  
  /* Netflix-specific */
  --hover-scale: 1.08;
  --hover-scale-large: 1.15;
  --hover-lift: -8px;
  --card-aspect-ratio: 1.5;
  --banner-height: 56.25vw;
  --header-height: 68px;
  --header-height-scrolled: 56px;
  --row-gap: 3vw;
  --card-gap: 0.5vw;
}

/* ============================================= */
/* 2. NETFLIX INTRO SPLASH SCREEN                */
/* ============================================= */
#netflix-intro {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: #000;
  z-index: var(--z-splash);
  display: flex;
  align-items: center;
  justify-content: center;
  animation: splashFadeOut 0.8s ease-in-out 3.2s forwards;
}

@keyframes splashFadeOut {
  to {
    opacity: 0;
    visibility: hidden;
  }
}

.netflix-logo-intro {
  width: 300px;
  height: 150px;
  position: relative;
}

.netflix-n {
  position: absolute;
  width: 100%;
  height: 100%;
}

.netflix-n-left,
.netflix-n-middle,
.netflix-n-right {
  position: absolute;
  background: var(--netflix-red);
  animation: nSlideIn 0.8s cubic-bezier(0.87, 0, 0.13, 1) forwards;
}

.netflix-n-left {
  width: 25%;
  height: 100%;
  left: 0;
  transform-origin: bottom;
  animation-delay: 0.3s;
  transform: scaleY(0);
}

.netflix-n-middle {
  width: 20%;
  height: 100%;
  left: 40%;
  transform: skewX(-15deg);
  transform-origin: bottom;
  animation-delay: 0.6s;
  opacity: 0;
}

.netflix-n-right {
  width: 25%;
  height: 100%;
  right: 0;
  transform-origin: bottom;
  animation-delay: 0.9s;
  transform: scaleY(0);
}

@keyframes nSlideIn {
  0% {
    transform: scaleY(0);
    opacity: 0;
  }
  100% {
    transform: scaleY(1);
    opacity: 1;
  }
}

.netflix-n-middle {
  animation: nMiddleSlide 0.8s cubic-bezier(0.87, 0, 0.13, 1) 0.6s forwards;
}

@keyframes nMiddleSlide {
  0% {
    opacity: 0;
    transform: skewX(-15deg) scaleY(0);
  }
  100% {
    opacity: 1;
    transform: skewX(-15deg) scaleY(1);
  }
}

.netflix-shadow {
  position: absolute;
  width: 100%;
  height: 100%;
  top: 0;
  left: 0;
  filter: blur(20px);
  opacity: 0;
  animation: shadowGlow 1s ease-in-out 1.2s forwards;
}

@keyframes shadowGlow {
  0% {
    opacity: 0;
    transform: scale(0.8);
  }
  50% {
    opacity: 0.6;
  }
  100% {
    opacity: 0.3;
    transform: scale(1.2);
  }
}

.tudum-sound {
  position: absolute;
  bottom: 20%;
  font-size: 2rem;
  color: var(--netflix-red);
  opacity: 0;
  animation: tudumPulse 0.5s ease-in-out 1.8s forwards;
  font-weight: var(--font-black);
  letter-spacing: 0.5rem;
}

@keyframes tudumPulse {
  0%, 100% {
    opacity: 0;
    transform: scale(0.8);
  }
  50% {
    opacity: 1;
    transform: scale(1.2);
  }
}

/* ============================================= */
/* 3. RESET & BASE STYLES                        */
/* ============================================= */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  overflow-x: hidden;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
}

body {
  background-color: var(--bg-primary);
  color: var(--text-primary);
  font-family: 'Netflix Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif;
  font-weight: var(--font-regular);
  font-size: 16px;
  line-height: 1.5;
  overflow-x: hidden;
  min-height: 100vh;
}

/* ============================================= */
/* 4. TYPOGRAPHY SYSTEM                          */
/* ============================================= */
h1, h2, h3, h4, h5, h6 {
  font-weight: var(--font-bold);
  margin: 0;
  line-height: 1.2;
  letter-spacing: -0.02em;
}

h1 { font-size: 3rem; font-weight: var(--font-black); }
h2 { font-size: 2.25rem; font-weight: var(--font-bold); }
h3 { font-size: 1.75rem; font-weight: var(--font-bold); }
h4 { font-size: 1.5rem; font-weight: var(--font-semibold); }
h5 { font-size: 1.25rem; font-weight: var(--font-medium); }
h6 { font-size: 1rem; font-weight: var(--font-medium); }

p { margin: 0; }

a {
  color: var(--text-primary);
  text-decoration: none;
  transition: color var(--transition-fast);
}

a:hover { color: var(--text-secondary); }

/* Typography Utilities */
.text-xs { font-size: 0.75rem; line-height: 1rem; }
.text-sm { font-size: 0.875rem; line-height: 1.25rem; }
.text-base { font-size: 1rem; line-height: 1.5rem; }
.text-lg { font-size: 1.125rem; line-height: 1.75rem; }
.text-xl { font-size: 1.25rem; line-height: 1.75rem; }
.text-2xl { font-size: 1.5rem; line-height: 2rem; }
.text-3xl { font-size: 1.875rem; line-height: 2.25rem; }
.text-4xl { font-size: 2.25rem; line-height: 2.5rem; }
.text-5xl { font-size: 3rem; line-height: 1; }
.text-6xl { font-size: 3.75rem; line-height: 1; }

.font-thin { font-weight: var(--font-thin); }
.font-light { font-weight: var(--font-light); }
.font-regular { font-weight: var(--font-regular); }
.font-medium { font-weight: var(--font-medium); }
.font-semibold { font-weight: var(--font-semibold); }
.font-bold { font-weight: var(--font-bold); }
.font-extrabold { font-weight: var(--font-extrabold); }
.font-black { font-weight: var(--font-black); }

.text-primary { color: var(--text-primary); }
.text-secondary { color: var(--text-secondary); }
.text-tertiary { color: var(--text-tertiary); }
.text-muted { color: var(--text-muted); }
.text-faint { color: var(--text-faint); }
.text-red { color: var(--netflix-red); }

.text-left { text-align: left; }
.text-center { text-align: center; }
.text-right { text-align: right; }

.uppercase { text-transform: uppercase; }
.lowercase { text-transform: lowercase; }
.capitalize { text-transform: capitalize; }

.tracking-tight { letter-spacing: -0.025em; }
.tracking-normal { letter-spacing: 0; }
.tracking-wide { letter-spacing: 0.025em; }

.truncate {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.line-clamp-2 {
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.line-clamp-3 {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

/* ============================================= */
/* 5. LAYOUT UTILITIES                           */
/* ============================================= */
.container {
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
  padding: 0 4%;
}

.container-fluid {
  width: 100%;
  padding: 0 4%;
}

/* Flexbox Utilities */
.flex { display: flex; }
.inline-flex { display: inline-flex; }
.flex-row { flex-direction: row; }
.flex-col { flex-direction: column; }
.flex-wrap { flex-wrap: wrap; }
.flex-nowrap { flex-wrap: nowrap; }

.items-start { align-items: flex-start; }
.items-center { align-items: center; }
.items-end { align-items: flex-end; }
.items-stretch { align-items: stretch; }

.justify-start { justify-content: flex-start; }
.justify-center { justify-content: center; }
.justify-end { justify-content: flex-end; }
.justify-between { justify-content: space-between; }
.justify-around { justify-content: space-around; }
.justify-evenly { justify-content: space-evenly; }

.flex-1 { flex: 1 1 0%; }
.flex-auto { flex: 1 1 auto; }
.flex-none { flex: none; }

/* Gap Utilities */
.gap-0 { gap: 0; }
.gap-1 { gap: var(--space-1); }
.gap-2 { gap: var(--space-2); }
.gap-3 { gap: var(--space-3); }
.gap-4 { gap: var(--space-4); }
.gap-5 { gap: var(--space-5); }
.gap-6 { gap: var(--space-6); }
.gap-8 { gap: var(--space-8); }
.gap-10 { gap: var(--space-10); }
.gap-12 { gap: var(--space-12); }

/* Spacing Utilities */
.m-0 { margin: 0; }
.m-1 { margin: var(--space-1); }
.m-2 { margin: var(--space-2); }
.m-3 { margin: var(--space-3); }
.m-4 { margin: var(--space-4); }
.m-6 { margin: var(--space-6); }
.m-8 { margin: var(--space-8); }
.m-auto { margin: auto; }

.mt-0 { margin-top: 0; }
.mt-1 { margin-top: var(--space-1); }
.mt-2 { margin-top: var(--space-2); }
.mt-3 { margin-top: var(--space-3); }
.mt-4 { margin-top: var(--space-4); }
.mt-6 { margin-top: var(--space-6); }
.mt-8 { margin-top: var(--space-8); }
.mt-12 { margin-top: var(--space-12); }
.mt-16 { margin-top: var(--space-16); }
.mt-20 { margin-top: var(--space-20); }

.mb-0 { margin-bottom: 0; }
.mb-1 { margin-bottom: var(--space-1); }
.mb-2 { margin-bottom: var(--space-2); }
.mb-3 { margin-bottom: var(--space-3); }
.mb-4 { margin-bottom: var(--space-4); }
.mb-6 { margin-bottom: var(--space-6); }
.mb-8 { margin-bottom: var(--space-8); }
.mb-12 { margin-bottom: var(--space-12); }
.mb-16 { margin-bottom: var(--space-16); }

.ml-0 { margin-left: 0; }
.ml-1 { margin-left: var(--space-1); }
.ml-2 { margin-left: var(--space-2); }
.ml-3 { margin-left: var(--space-3); }
.ml-4 { margin-left: var(--space-4); }
.ml-auto { margin-left: auto; }

.mr-0 { margin-right: 0; }
.mr-1 { margin-right: var(--space-1); }
.mr-2 { margin-right: var(--space-2); }
.mr-3 { margin-right: var(--space-3); }
.mr-4 { margin-right: var(--space-4); }
.mr-auto { margin-right: auto; }

.p-0 { padding: 0; }
.p-1 { padding: var(--space-1); }
.p-2 { padding: var(--space-2); }
.p-3 { padding: var(--space-3); }
.p-4 { padding: var(--space-4); }
.p-6 { padding: var(--space-6); }
.p-8 { padding: var(--space-8); }

.pt-0 { padding-top: 0; }
.pt-1 { padding-top: var(--space-1); }
.pt-2 { padding-top: var(--space-2); }
.pt-3 { padding-top: var(--space-3); }
.pt-4 { padding-top: var(--space-4); }
.pt-6 { padding-top: var(--space-6); }
.pt-8 { padding-top: var(--space-8); }

.pb-0 { padding-bottom: 0; }
.pb-1 { padding-bottom: var(--space-1); }
.pb-2 { padding-bottom: var(--space-2); }
.pb-3 { padding-bottom: var(--space-3); }
.pb-4 { padding-bottom: var(--space-4); }
.pb-6 { padding-bottom: var(--space-6); }
.pb-8 { padding-bottom: var(--space-8); }

.pl-0 { padding-left: 0; }
.pl-1 { padding-left: var(--space-1); }
.pl-2 { padding-left: var(--space-2); }
.pl-3 { padding-left: var(--space-3); }
.pl-4 { padding-left: var(--space-4); }

.pr-0 { padding-right: 0; }
.pr-1 { padding-right: var(--space-1); }
.pr-2 { padding-right: var(--space-2); }
.pr-3 { padding-right: var(--space-3); }
.pr-4 { padding-right: var(--space-4); }

/* ============================================= */
/* 6. HEADER & NAVIGATION (NETFLIX STYLE)        */
/* ============================================= */
header {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: var(--z-fixed);
  background: var(--bg-gradient-top);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  padding: 0 4%;
  height: var(--header-height);
  display: flex;
  align-items: center;
  transition: all var(--transition-base);
  border-bottom: 1px solid transparent;
}

header.scrolled {
  background: rgba(20, 20, 20, 0.95);
  height: var(--header-height-scrolled);
  box-shadow: var(--shadow-md);
  border-bottom-color: var(--border-faint);
}

.header-content {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 100%;
  max-width: 1920px;
  margin: 0 auto;
}

/* Logo - Netflix Style N */
.logo {
  font-size: 2.5rem;
  font-weight: var(--font-black);
  color: var(--netflix-red);
  text-decoration: none;
  letter-spacing: -2px;
  cursor: pointer;
  user-select: none;
  position: relative;
  padding: 0.5rem 0;
  transition: all var(--transition-fast);
  font-family: 'Netflix Sans', Arial, sans-serif;
}

.logo:hover {
  color: var(--netflix-red-light);
  transform: scale(1.05);
  filter: drop-shadow(0 0 10px rgba(229, 9, 20, 0.6));
}

/* Navigation */
.nav {
  display: flex;
  align-items: center;
  gap: var(--space-6);
  margin-left: var(--space-12);
}

.nav-link {
  color: var(--text-secondary);
  font-size: 0.95rem;
  font-weight: var(--font-medium);
  text-decoration: none;
  transition: color var(--transition-fast);
  position: relative;
  padding: 0.5rem 0;
  cursor: pointer;
}

.nav-link::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: var(--text-primary);
  transform: scaleX(0);
  transition: transform var(--transition-fast);
}

.nav-link:hover {
  color: var(--text-primary);
}

.nav-link:hover::after {
  transform: scaleX(1);
}

.nav-link.active {
  color: var(--text-primary);
  font-weight: var(--font-bold);
}

/* Search Box */
.search-container {
  flex: 1;
  max-width: 600px;
  margin: 0 var(--space-8);
  position: relative;
}

.search-wrapper {
  position: relative;
  display: flex;
  align-items: center;
}

.search-icon {
  position: absolute;
  left: 1rem;
  color: var(--text-muted);
  pointer-events: none;
  transition: color var(--transition-fast);
  font-size: 1.1rem;
}

#search {
  width: 100%;
  padding: 0.75rem 1rem 0.75rem 2.75rem;
  font-size: 0.95rem;
  font-weight: var(--font-regular);
  background: rgba(0, 0, 0, 0.5);
  border: 1px solid var(--border-secondary);
  border-radius: var(--radius-sm);
  color: var(--text-primary);
  outline: none;
  transition: all var(--transition-fast);
  font-family: inherit;
}

#search::placeholder {
  color: var(--text-muted);
  font-weight: var(--font-light);
}

#search:focus {
  background: rgba(0, 0, 0, 0.75);
  border-color: var(--text-primary);
  box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.1);
}

#search:focus + .search-icon {
  color: var(--text-primary);
}

/* User Menu */
.user-menu {
  display: flex;
  align-items: center;
  gap: var(--space-6);
}

.icon-button {
  background: none;
  border: none;
  color: var(--text-primary);
  cursor: pointer;
  padding: 0.5rem;
  font-size: 1.25rem;
  transition: all var(--transition-fast);
  border-radius: var(--radius-sm);
  position: relative;
}

.icon-button:hover {
  color: var(--text-secondary);
  background: rgba(255, 255, 255, 0.1);
}

.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  background: var(--netflix-red);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: var(--font-bold);
  font-size: 0.875rem;
  cursor: pointer;
  transition: all var(--transition-fast);
  box-shadow: var(--shadow-sm);
}

.user-avatar:hover {
  transform: scale(1.1);
  box-shadow: var(--shadow-red);
}

/* ============================================= */
/* 7. MAIN CONTENT AREA                          */
/* ============================================= */
main {
  padding-top: calc(var(--header-height) + 20px);
  padding-bottom: var(--space-20);
  min-height: 100vh;
}

/* ============================================= */
/* 8. SECTION TITLES                             */
/* ============================================= */
.section-title {
  font-size: 1.4rem;
  font-weight: var(--font-bold);
  color: var(--text-primary);
  margin-bottom: var(--space-4);
  letter-spacing: -0.02em;
  position: relative;
  padding-left: 4%;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-explore {
  font-size: 0.875rem;
  color: var(--text-muted);
  font-weight: var(--font-medium);
  transition: color var(--transition-fast);
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: var(--space-2);
  padding-right: 4%;
}

.section-explore:hover {
  color: var(--text-primary);
}

/* ============================================= */
/* 9. CONTENT ROWS & SLIDERS                    */
/* ============================================= */
.content-row {
  margin-bottom: var(--row-gap);
  position: relative;
  padding: 0;
}

.row-container {
  position: relative;
  overflow: visible;
}

.row-slider {
  display: flex;
  gap: var(--card-gap);
  overflow-x: auto;
  overflow-y: visible;
  padding: 1.5rem 4% 2rem;
  scroll-behavior: smooth;
  scroll-snap-type: x mandatory;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
  -ms-overflow-style: none;
}

.row-slider::-webkit-scrollbar {
  display: none;
}

.row-slider > * {
  scroll-snap-align: start;
  flex-shrink: 0;
}

/* ============================================= */
/* 10. CONTENT CARDS (NETFLIX STYLE)            */
/* ============================================= */
.card {
  position: relative;
  width: 300px;
  aspect-ratio: 16 / 9;
  background-color: var(--bg-card);
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  border-radius: var(--radius-sm);
  cursor: pointer;
  overflow: hidden;
  transition: all var(--transition-base);
  box-shadow: var(--shadow-md);
  transform-origin: center center;
  border: 2px solid transparent;
}

.card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(
    180deg,
    transparent 0%,
    rgba(0, 0, 0, 0.3) 50%,
    rgba(0, 0, 0, 0.8) 100%
  );
  opacity: 0;
  transition: opacity var(--transition-fast);
  z-index: 1;
}

.card:hover::before {
  opacity: 1;
}

.card:hover {
  transform: scale(var(--hover-scale-large));
  z-index: var(--z-dropdown);
  box-shadow: var(--shadow-2xl);
  border-color: rgba(255, 255, 255, 0.2);
}

/* Card Content Overlay */
.card-overlay {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 1.5rem 1rem 1rem;
  background: linear-gradient(
    180deg,
    transparent 0%,
    rgba(0, 0, 0, 0.9) 50%
  );
  transform: translateY(10px);
  opacity: 0;
  transition: all var(--transition-base);
  z-index: 2;
}

.card:hover .card-overlay {
  transform: translateY(0);
  opacity: 1;
}

.card-title {
  font-size: 1rem;
  font-weight: var(--font-bold);
  color: var(--text-primary);
  margin-bottom: var(--space-2);
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.8);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.card-meta {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  font-size: 0.75rem;
  color: var(--text-tertiary);
  margin-bottom: var(--space-2);
}

.card-match {
  color: #46d369;
  font-weight: var(--font-bold);
}

.card-rating {
  padding: 0.125rem 0.375rem;
  border: 1px solid var(--text-muted);
  border-radius: 2px;
  font-size: 0.65rem;
  font-weight: var(--font-semibold);
}

.card-genres {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-1);
  font-size: 0.75rem;
  color: var(--text-tertiary);
}

.card-genre {
  position: relative;
}

.card-genre:not(:last-child)::after {
  content: '•';
  margin-left: var(--space-1);
  color: var(--text-muted);
}

/* Card Actions */
.card-actions {
  position: absolute;
  top: 0.75rem;
  right: 0.75rem;
  display: flex;
  gap: var(--space-2);
  opacity: 0;
  transform: translateY(-10px);
  transition: all var(--transition-base);
  z-index: 3;
}

.card:hover .card-actions {
  opacity: 1;
  transform: translateY(0);
}

.card-action-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  background: rgba(42, 42, 42, 0.8);
  border: 2px solid rgba(255, 255, 255, 0.5);
  color: var(--text-primary);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: all var(--transition-fast);
  backdrop-filter: blur(5px);
  font-size: 0.875rem;
}

.card-action-btn:hover {
  background: rgba(255, 255, 255, 0.2);
  border-color: var(--text-primary);
  transform: scale(1.15);
}

/* Play Icon Overlay */
.card-play-icon {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%) scale(0);
  width: 70px;
  height: 70px;
  background: rgba(255, 255, 255, 0.95);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  transition: all var(--transition-base);
  z-index: 3;
  box-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
  border: 4px solid rgba(255, 255, 255, 0.3);
}

.card-play-icon::after {
  content: '▶';
  color: var(--bg-primary);
  font-size: 2rem;
  margin-left: 4px;
}

.card:hover .card-play-icon {
  transform: translate(-50%, -50%) scale(1);
  opacity: 1;
}

.card:active .card-play-icon {
  transform: translate(-50%, -50%) scale(0.9);
}

/* ============================================= */
/* 11. VIDEO PLAYER SECTION                      */
/* ============================================= */
#player-box {
  margin: var(--space-16) auto;
  max-width: 1400px;
  padding: 0 4%;
  display: none;
  animation: fadeInUp 0.6s var(--ease-out);
}

#player-box.active {
  display: block;
}

.player-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: var(--space-6);
}

.player-title {
  font-size: 2rem;
  font-weight: var(--font-bold);
  color: var(--text-primary);
  text-shadow: 0 2px 4px rgba(0, 0, 0, 0.6);
}

.player-close {
  background: rgba(255, 255, 255, 0.1);
  border: none;
  color: var(--text-primary);
  padding: 0.75rem 1.5rem;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: 1rem;
  font-weight: var(--font-medium);
  transition: all var(--transition-fast);
  font-family: inherit;
}

.player-close:hover {
  background: rgba(255, 255, 255, 0.2);
  transform: scale(1.05);
}

.player-wrapper {
  position: relative;
  width: 100%;
  aspect-ratio: 16 / 9;
  background: #000;
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-2xl);
}

iframe {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}

/* ============================================= */
/* 12. LOADING STATES                            */
/* ============================================= */
.loading-skeleton {
  background: linear-gradient(
    90deg,
    var(--bg-card) 0%,
    rgba(255, 255, 255, 0.05) 50%,
    var(--bg-card) 100%
  );
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}

@keyframes shimmer {
  0% { background-position: -200% 0; }
  100% { background-position: 200% 0; }
}

.skeleton-card {
  width: 300px;
  aspect-ratio: 16 / 9;
}

.skeleton-title {
  height: 32px;
  width: 200px;
  margin-bottom: var(--space-4);
}

/* Loading Spinner */
.spinner {
  width: 50px;
  height: 50px;
  border: 3px solid rgba(255, 255, 255, 0.1);
  border-top-color: var(--netflix-red);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loading-container {
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 400px;
}

/* ============================================= */
/* 13. EMPTY STATES                              */
/* ============================================= */
.empty-state {
  text-align: center;
  padding: var(--space-20) var(--space-8);
  color: var(--text-tertiary);
}

.empty-state-icon {
  font-size: 5rem;
  margin-bottom: var(--space-6);
  opacity: 0.3;
}

.empty-state-title {
  font-size: 1.75rem;
  font-weight: var(--font-bold);
  color: var(--text-secondary);
  margin-bottom: var(--space-3);
}

.empty-state-description {
  font-size: 1.125rem;
  color: var(--text-muted);
  max-width: 500px;
  margin: 0 auto var(--space-6);
  line-height: 1.6;
}

.no-results {
  display: none;
  text-align: center;
  padding: var(--space-16);
  color: var(--text-tertiary);
  font-size: 1.25rem;
  font-style: italic;
}

.no-results.visible {
  display: block;
}

/* ============================================= */
/* 14. ANIMATIONS & KEYFRAMES                    */
/* ============================================= */
@keyframes fadeIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}

@keyframes fadeInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes fadeInDown {
  from {
    opacity: 0;
    transform: translateY(-30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes slideInLeft {
  from {
    opacity: 0;
    transform: translateX(-50px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes slideInRight {
  from {
    opacity: 0;
    transform: translateX(50px);
  }
  to {
    opacity: 1;
    transform: translateX(0);
  }
}

@keyframes scaleIn {
  from {
    opacity: 0;
    transform: scale(0.8);
  }
  to {
    opacity: 1;
    transform: scale(1);
  }
}

@keyframes pulse {
  0%, 100% {
    opacity: 1;
  }
  50% {
    opacity: 0.5;
  }
}

@keyframes bounce {
  0%, 100% {
    transform: translateY(0);
  }
  50% {
    transform: translateY(-10px);
  }
}

/* Animation Classes */
.fade-in {
  animation: fadeIn 0.5s var(--ease-out);
}

.fade-in-up {
  animation: fadeInUp 0.6s var(--ease-out);
}

.fade-in-down {
  animation: fadeInDown 0.6s var(--ease-out);
}

.slide-in-left {
  animation: slideInLeft 0.5s var(--ease-out);
}

.slide-in-right {
  animation: slideInRight 0.5s var(--ease-out);
}

.scale-in {
  animation: scaleIn 0.4s var(--ease-out);
}

.pulse-animation {
  animation: pulse 2s infinite;
}

  SEARCH_DEBOUNCE: 200,
  TV_JSON_URL: 'https://7-7-7-15.github.io/Tv.json',
  MOVIE_JSON_URL: 'https://7-7-7-15.github.io/Movies.json',
  POSTER_BASE_URL: 'https://image.tmdb.org/t/p/w500',
  VIDEO_BASE_URL: 'https://turbovid.eu/api/req'
};

/* ============================================= */
/* 3. DATA LOADING & INITIALIZATION              */
/* ============================================= */
async function loadContent() {
  try {
    STATE.isLoading = true;
    showLoadingState();
    
    const [tvData, movieData] = await Promise.all([
      fetch(CONFIG.TV_JSON_URL).then(r => r.json()),
      fetch(CONFIG.MOVIE_JSON_URL).then(r => r.json())
    ]);
    
    STATE.allItems = [
      ...tvData.map(item => ({ ...item, type: 'tv', category: 'TV Shows' })),
      ...movieData.map(item => ({ ...item, type: 'movie', category: 'Movies' }))
    ];
    
    STATE.filteredItems = STATE.allItems;
    STATE.isLoading = false;
    
    renderContent();
  } catch (error) {
    console.error('Failed to load content:', error);
    showErrorState();
    STATE.isLoading = false;
  }
}

/* ============================================= */
/* 4. SEARCH FUNCTIONALITY                       */
/* ============================================= */
let searchTimer;

function handleSearch(event) {
  const term = event.target.value.trim().toLowerCase();
  
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => {
    STATE.searchTerm = term;
    
    if (term === '') {
      STATE.filteredItems = STATE.allItems;
    } else {
      STATE.filteredItems = STATE.allItems.filter(item =>
        item.title.toLowerCase().includes(term)
      );
    }
    
    renderContent();
  }, CONFIG.SEARCH_DEBOUNCE);
}

/* ============================================= */
/* 5. RENDERING FUNCTIONS                        */
/* ============================================= */
function renderContent() {
  const resultsContainer = document.getElementById('results');
  const noResults = document.getElementById('no-results');
  
  resultsContainer.innerHTML = '';
  
  if (STATE.filteredItems.length === 0) {
    noResults.classList.remove('hidden');
    noResults.classList.add('visible');
    return;
  }
  
  noResults.classList.add('hidden');
  noResults.classList.remove('visible');
  
  const itemsToShow = STATE.filteredItems.slice(0, CONFIG.MAX_ITEMS);
  const tvShows = itemsToShow.filter(item => item.type === 'tv');
  const movies = itemsToShow.filter(item => item.type === 'movie');
  
  if (tvShows.length > 0) {
    renderRow('TV Shows', tvShows, 'tv-shows-row');
  }
  
  if (movies.length > 0) {
    renderRow('Movies', movies, 'movies-row');
  }
}

function renderRow(title, items, id) {
  const resultsContainer = document.getElementById('results');
  
  const row = document.createElement('div');
  row.className = 'content-row fade-in-up';
  row.id = id;
  
  const titleElement = document.createElement('div');
  titleElement.className = 'section-title';
  titleElement.innerHTML = `
    <span>${title}</span>
    <span class="section-explore">Explore All ›</span>
  `;
  
  const rowContainer = document.createElement('div');
  rowContainer.className = 'row-container';
  
  const slider = document.createElement('div');
  slider.className = 'row-slider';
  slider.id = `${id}-slider`;
  
  items.forEach(item => {
    const card = createCard(item);
    slider.appendChild(card);
  });
  
  rowContainer.appendChild(slider);
  row.appendChild(titleElement);
  row.appendChild(rowContainer);
  
  resultsContainer.appendChild(row);
}

function createCard(item) {
  const card = document.createElement('div');
  card.className = 'card';
  card.setAttribute('role', 'button');
  card.setAttribute('tabindex', '0');
  card.setAttribute('aria-label', `Play ${item.title}`);
  
  const posterUrl = `${CONFIG.POSTER_BASE_URL}/${item.tmdb}.jpg`;
  card.style.backgroundImage = `url(${posterUrl})`;
  
  const overlay = document.createElement('div');
  overlay.className = 'card-overlay';
  
  const cardTitle = document.createElement('div');
  cardTitle.className = 'card-title';
  cardTitle.textContent = item.title;
  
  const meta = document.createElement('div');
  meta.className = 'card-meta';
  meta.innerHTML = `
    <span class="card-match">98% Match</span>
    <span class="card-rating">PG-13</span>
    <span>${item.type === 'tv' ? 'Series' : 'Movie'}</span>
  `;
  
  const genres = document.createElement('div');
  genres.className = 'card-genres';
  genres.innerHTML = `
    <span class="card-genre">Drama</span>
    <span class="card-genre">Thriller</span>
  `;
  
  overlay.appendChild(cardTitle);
  overlay.appendChild(meta);
  overlay.appendChild(genres);
  
  const playIcon = document.createElement('div');
  playIcon.className = 'card-play-icon';
  playIcon.setAttribute('aria-hidden', 'true');
  
  const actions = document.createElement('div');
  actions.className = 'card-actions';
  actions.innerHTML = `
    <button class="card-action-btn" aria-label="Add to list">+</button>
    <button class="card-action-btn" aria-label="Like">👍</button>
  `;
  
  card.appendChild(overlay);
  card.appendChild(playIcon);
  card.appendChild(actions);
  
  card.addEventListener('click', () => playContent(item));
  card.addEventListener('keypress', (e) => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      playContent(item);
    }
  });
  
  return card;
}

/* ============================================= */
/* 6. VIDEO PLAYER FUNCTIONS                     */
/* ============================================= */
function playContent(item) {
  const playerBox = document.getElementById('player-box');
  const playerTitle = document.getElementById('player-title');
  const iframe = document.getElementById('player');
  
  const baseType = item.type === 'movie' ? 'movie' : 'tv';
  const suffix = item.type === 'movie' ? '' : '/1/1';
  const videoUrl = `${CONFIG.VIDEO_BASE_URL}/${baseType}/${item.tmdb}${suffix}`;
  
  iframe.src = videoUrl;
  playerTitle.textContent = item.title;
  
  playerBox.classList.remove('hidden');
  playerBox.classList.add('active');
  
  setTimeout(() => {
    playerBox.scrollIntoView({ 
      behavior: 'smooth', 
      block: 'start' 
    });
  }, 100);
}

function closePlayer() {
  const playerBox = document.getElementById('player-box');
  const iframe = document.getElementById('player');
  
  iframe.src = '';
  playerBox.classList.add('hidden');
  playerBox.classList.remove('active');
  
  window.scrollTo({ 
    top: 0, 
    behavior: 'smooth' 
  });
}

/* ============================================= */
/* 7. UI STATE FUNCTIONS                         */
/* ============================================= */
function showLoadingState() {
  const resultsContainer = document.getElementById('results');
  resultsContainer.innerHTML = `
    <div class="loading-container">
      <div class="spinner"></div>
    </div>
  `;
}

function showErrorState() {
  const resultsContainer = document.getElementById('results');
  resultsContainer.innerHTML = `
    <div class="empty-state">
      <div class="empty-state-icon">⚠️</div>
      <h2 class="empty-state-title">Oops! Something went wrong</h2>
      <p class="empty-state-description">
        We're having trouble loading content. Please try refreshing the page.
      </p>
    </div>
  `;
}

/* ============================================= */
/* 8. HEADER SCROLL EFFECT                       */
/* ============================================= */
function handleScroll() {
  const header = document.getElementById('header');
  const scrolled = window.scrollY > 50;
  
  header.classList.toggle('scrolled', scrolled);
}

/* ============================================= */
/* 9. EVENT LISTENERS & INITIALIZATION           */
/* ============================================= */
document.addEventListener('DOMContentLoaded', () => {
  const searchInput = document.getElementById('search');
  searchInput.addEventListener('input', handleSearch);
  
  window.addEventListener('scroll', handleScroll, { passive: true });
  
  // Wait for intro animation to finish before loading content
  setTimeout(() => {
    loadContent();
  }, 3500);
});

/* ============================================= */
/* 10. KEYBOARD NAVIGATION                       */
/* ============================================= */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    const playerBox = document.getElementById('player-box');
    if (playerBox.classList.contains('active')) {
      closePlayer();
    }
  }
});

/* ============================================= */
/* 11. UTILITY FUNCTIONS                         */
/* ============================================= */
function debounce(func, wait) {
  let timeout;
  return function executedFunction(...args) {
    const later = () => {
      clearTimeout(timeout);
      func(...args);
    };
    clearTimeout(timeout);
    timeout = setTimeout(later, wait);
  };
}

function formatDuration(minutes) {
  const hours = Math.floor(minutes / 60);
  const mins = minutes % 60;
  return hours > 0 ? `${hours}h ${mins}m` : `${mins}m`;
}

function formatNumber(num) {
  if (num >= 1000000) {
    return (num / 1000000).toFixed(1) + 'M';
  }
  if (num >= 1000) {
    return (num / 1000).toFixed(1) + 'K';
  }
  return num.toString();
}

/* ============================================= */
/* END OF JAVASCRIPT                             */
/* ============================================= */
</script>

</body>
</html>
